<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="chart-title chart-description" font-family="system-ui, sans-serif">
<title id="chart-title">Convergence with the number of segments per span</title>
<desc id="chart-description">Convergence with the number of segments per span. Peak field of the 3D charge simulation at mid-span divided by the peak field of the 2D cross-section, against the number of segments per span, for the default horizontal tower with a 10 m sag and with no sag. The 2D model uses the mid-span heights. Segments per span runs from 0 to 50. Peak 3D over peak 2D runs from 0.96 to 1.002. E, sag 10 m: 10 points, minimum 0.9782 at 4, maximum 0.9972 at 48. B, sag 10 m: 10 points, minimum 0.9691 at 4, maximum 0.9909 at 48. E, sag 0: 10 points, minimum 1 at 48, maximum 1 at 4. B, sag 0: 10 points, minimum 0.9998 at 24, maximum 0.9998 at 48.</desc>
