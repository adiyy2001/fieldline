<title id="chart-title">One conductor above ground: model against the analytic solution</title>
<desc id="chart-description">One conductor above ground: model against the analytic solution. Electric field at 1 m above ground for a 230.94 kV conductor at 12 m with a 15 mm radius. The model curve is the line charge solution, the markers are the closed form. Lateral distance (m) runs from -30 to 30. E, rms (kV/m) runs from 0 to 6. Model: 121 points, minimum 0.7191 at -30, maximum 5.254 at 0. Analytic: 21 points, minimum 0.7191 at -30, maximum 5.254 at 0.</desc>
