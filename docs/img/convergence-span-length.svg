<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="chart-title chart-description" font-family="system-ui, sans-serif">
<title id="chart-title">Convergence to the 2D model as the span grows</title>
<desc id="chart-description">Convergence to the 2D model as the span grows. Peak field of the 3D charge simulation at mid-span divided by the peak field of the 2D cross-section, against the span length, with three equal spans, 12 segments per span, a 10 m sag and no sag. Span length (m) runs from 10 to 1000. Peak 3D over peak 2D runs from 0.84 to 1.002. E, sag 10 m: 9 points, minimum 0.9194 at 50, maximum 0.9973 at 800. B, sag 10 m: 9 points, minimum 0.8452 at 50, maximum 0.996 at 800. E, sag 0: 9 points, minimum 0.9996 at 50, maximum 1 at 800. B, sag 0: 9 points, minimum 0.9928 at 50, maximum 1 at 800.</desc>
