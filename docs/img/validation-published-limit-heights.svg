<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-labelledby="chart-title chart-description" font-family="system-ui, sans-serif">
<title id="chart-title">Limit heights: reproduced against published</title>
<desc id="chart-description">Limit heights: reproduced against published. Lowest clearance at which E stays below 5 kV/m or B below 100 microtesla at 1.8 m, for 13 tower and phasing cases of a 420 kV line. The Portal tower is fitted and left out. Published limit height (m) runs from 5 to 18. Reproduced limit height (m) runs from 5 to 18. Equal: 2 points, minimum 5 at 5, maximum 18 at 18. E limit height: 13 points, minimum 11.03 at 11.05, maximum 16.66 at 16.68. B limit height: 13 points, minimum 5.592 at 5.62, maximum 6.92 at 6.94.</desc>
