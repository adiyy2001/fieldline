<div role="tablist" aria-label="Views">
  @for (tab of tabs; track tab.id; let index = $index) {
    <button
      type="button"
      role="tab"
      [id]="'fl-tab-' + tab.id"
      [attr.aria-selected]="store.view() === tab.id"
      [attr.aria-disabled]="disabled(tab.id) ? 'true' : null"
      [attr.aria-describedby]="disabled(tab.id) ? 'fl-views3d-notice' : null"
      [attr.aria-controls]="'fl-view-' + tab.id"
      [attr.aria-keyshortcuts]="ui.shortcutsEnabled() ? tab.key : null"
      [tabindex]="store.view() === tab.id ? 0 : -1"
      (click)="select(tab.id)"
      (keydown)="navigate($event, index)"
    >
      {{ tab.label }}
      @if (ui.shortcutsEnabled()) {
        <kbd aria-hidden="true">{{ tab.key }}</kbd>
      }
    </button>
  }
</div>
