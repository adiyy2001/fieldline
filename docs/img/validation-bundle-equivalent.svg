<title id="chart-title">Equivalent conductor against explicit subconductors</title>
<desc id="chart-description">Equivalent conductor against explicit subconductors. Change of the limit height in metres when each three-conductor bundle is replaced by its equivalent conductor, for the 14 cases. Limit height with explicit subconductors (m) runs from 4 to 18. Shift with equivalent conductor (m) runs from -0.002 to 0.01. E limit height: 14 points, minimum 0 at 14.77, maximum 0.008804 at 13.7. B limit height: 14 points, minimum -0.0007675 at 5.592, maximum -0.0002205 at 6.92.</desc>
