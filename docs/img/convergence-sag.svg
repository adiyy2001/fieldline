<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="chart-title chart-description" font-family="system-ui, sans-serif">
<title id="chart-title">Convergence to the 2D model as the sag goes to zero</title>
<desc id="chart-description">Convergence to the 2D model as the sag goes to zero. Peak field of the 3D charge simulation at mid-span divided by the peak field of the 2D cross-section, against the sag, for three spans of 300 m and 12 segments per span. Sag (m) runs from 0 to 25. Peak 3D over peak 2D runs from 0.96 to 1.002. E: 10 points, minimum 0.9809 at 25, maximum 1 at 0. B: 10 points, minimum 0.9759 at 25, maximum 0.9998 at 0.</desc>
